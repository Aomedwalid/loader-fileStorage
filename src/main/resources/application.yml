spring:
  application:
    name : FileManager
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/filetest
    username: postgres
    password: 10174
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      password:

app:
  upload:
    base-path: "/var/myapp/uploads/temp"
    final-path: "/var/myapp/uploads/fin"
#    base-path: "/var/myapp/uploads/temp" for production

  encryption:
    enabled: true
    aes-key: "/secured/path/aes.txt"
    level: 256

  download:
    chunk-size: 1048576
    max-chunk-size: 104857600

  clamav:
    enabled: true
    path: 'C:\Program Files\ClamAV\clamscan.exe'

  redis:
    progress-key-prefix: "progress : "
    chunk-key-prefix: "Chunk : "